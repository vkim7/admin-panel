name = "recording-downloader"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# R2 bucket binding — same bucket as the admin app uses
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "admin-panel"

[vars]
# CALLBACK_SECRET — set via `wrangler secret put CALLBACK_SECRET`
# CALLBACK_URL — set via `wrangler secret put CALLBACK_URL`
